services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expedientes
      POSTGRES_PASSWORD: expedientes
      POSTGRES_DB: expedientes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expedientes -d expedientes"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Una instancia del modelo. Atiende una petición a la vez y mantiene el modelo cargado en
  # memoria; el backend encola las demás (OLLAMA_BASE_URLS). Para más capacidad, agrega otro
  # servicio igual y su URL en OLLAMA_BASE_URLS (ver README).
  # Sin puertos publicados: la API de Ollama no tiene autenticación y solo la usa el backend.
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    # Espera a que Ollama acepte conexiones y reintenta si la descarga se corta (Ollama la
    # reanuda). Si un intento falla, borra los parciales por si quedaron dañados y empieza limpio.
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 1 60); do ollama list >/dev/null 2>&1 && break; sleep 2; done
        for intento in 1 2 3 4 5; do
          echo "Descargando modelo qwen2.5:3b en Ollama (intento $$intento)..."
          ollama pull qwen2.5:3b && exit 0
          echo "La descarga falló; se descartan los archivos parciales y se reintenta."
          rm -f /root/.ollama/models/blobs/*-partial*
          sleep 5
        done
        exit 1

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - expedientes_data:/data/expedientes
      # Modelos de PaddleOCR: se descargan la primera vez que se hace OCR y se conservan aquí.
      - paddle_modelos:/root/.paddlex
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  expedientes_data:
  pgdata:
  paddle_modelos:
  ollama_data:
